apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: application-a-postgres
  labels:
    app: application-a-postgres
spec:
  serviceName: application-a-postgres
  replicas: 1
  selector:
    matchLabels:
      app: application-a-postgres
  template:
    metadata:
      labels:
        app: application-a-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - name: POSTGRES_USER
              value: demo
            - name: POSTGRES_PASSWORD
              value: demo
            - name: POSTGRES_DB
              value: demo
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "demo"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
